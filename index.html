<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motiv Cockpit</title>
<style>
:root{
  --bg:#0d0d0d; --card:#171717; --card-2:#1e1e1e; --line:#2b2b2b; --line-2:#3a3a3a;
  --txt:#f2f2f0; --txt-2:#9a9a95; --txt-3:#6e6e69;
  --neon:#cdf556; --neon-ink:#111;
  --c-tun:#ff6b4a; --c-lauf:#4a7dff; --c-gut:#4ad3a0; --c-aus:#5a5a55; --c-frage:#c084fc; --c-besicht:#22c4c4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,sans-serif;
  font-size:14px;-webkit-font-smoothing:antialiased}
.shell{max-width:1400px;margin:0 auto;padding:26px 26px 90px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.mark{width:42px;height:42px;border-radius:50%;border:1px solid var(--neon);
  display:grid;place-items:center;color:var(--neon);font-size:19px;flex:none}
.brand small{display:block;font-size:10.5px;letter-spacing:.19em;color:var(--txt-2);margin-bottom:3px}
.brand b{font-size:19px;font-weight:600;letter-spacing:-.01em}
.top .sp{flex:1}
.whoami{display:flex;gap:0;border:1px solid var(--line-2);border-radius:99px;overflow:hidden;background:var(--card)}
.whoami button{border:0;background:none;color:var(--txt-2);font:inherit;font-size:13px;padding:9px 18px;cursor:pointer}
.whoami button[aria-pressed="true"]{background:var(--neon);color:var(--neon-ink);font-weight:600}
.head{display:flex;align-items:flex-end;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:10.5px;letter-spacing:.19em;color:var(--txt-3);margin-bottom:8px}
h1{font-size:44px;line-height:1;font-weight:700;letter-spacing:-.025em;margin:0}
.head .sp{flex:1}
.cta{background:var(--neon);color:var(--neon-ink);border:0;border-radius:99px;font:inherit;font-size:14.5px;font-weight:650;padding:14px 24px;cursor:pointer;display:flex;gap:9px;align-items:center}
.cta:hover{filter:brightness(1.08)}
.cta:disabled{opacity:.35;cursor:default}
.cta.quiet{background:none;color:var(--txt-2);border:1px solid var(--line-2);font-weight:500;padding:13px 20px}
.cta.quiet:hover{color:var(--txt);filter:none;border-color:var(--txt-3)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--line-2)}
.kpi.a::before{background:var(--neon)} .kpi.b::before{background:var(--c-tun)}
.kpi.c::before{background:var(--c-lauf)} .kpi.d::before{background:var(--c-gut)}
.kpi h3{font-size:10.5px;letter-spacing:.15em;color:var(--txt-2);font-weight:600;margin:0 0 14px}
.kpi .num{font-size:38px;font-weight:700;line-height:1;letter-spacing:-.03em}
.kpi .unit{font-size:13px;color:var(--txt-2);font-weight:400;margin-left:7px}
.kpi .foot{font-size:12px;color:var(--txt-3);margin-top:12px;line-height:1.5}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.pill{border:1px solid var(--line-2);background:var(--card);color:var(--txt-2);font:inherit;font-size:13px;padding:9px 17px;border-radius:99px;cursor:pointer}
.pill:hover{color:var(--txt)}
.pill[aria-pressed="true"]{background:var(--neon);border-color:var(--neon);color:var(--neon-ink);font-weight:650}
.pills .sp{flex:1}
input,select,textarea{font:inherit;font-size:13.5px;color:var(--txt);background:var(--card);border:1px solid var(--line-2);border-radius:9px;padding:9px 12px;width:100%}
input::placeholder,textarea::placeholder{color:var(--txt-3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--neon)}
.suche{max-width:250px}
select option{background:#1a1a1a}
.board{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow-x:auto;overflow-y:hidden}
table{width:100%;border-collapse:collapse}
thead th{font-size:10.5px;letter-spacing:.13em;color:var(--txt-3);font-weight:600;text-align:left;padding:16px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th.r{text-align:right;position:sticky;right:0;background:var(--card);box-shadow:-6px 0 8px -6px rgba(0,0,0,.4)}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--card-2)}
td{padding:12px 10px;vertical-align:top}
td.r{text-align:right;position:sticky;right:0;background:var(--card);box-shadow:-6px 0 8px -6px rgba(0,0,0,.4)}
tbody tr:hover td.r{background:var(--card-2)}
.name{display:flex;gap:12px;align-items:flex-start;min-width:230px}
.stripe{width:3px;align-self:stretch;min-height:34px;border-radius:2px;background:var(--c-aus);flex:none}
.stripe.tun{background:var(--c-tun)} .stripe.lauf{background:var(--c-lauf)}
.stripe.gut{background:var(--c-gut)} .stripe.neon{background:var(--neon)} .stripe.frage{background:var(--c-frage)} .stripe.besicht{background:var(--c-besicht)}
.name b{display:block;font-size:14px;font-weight:600;line-height:1.35}
.name span{display:block;font-size:12.5px;color:var(--txt-3);margin-top:3px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:99px;border:1px solid var(--line-2);color:var(--txt-2);white-space:nowrap}
.badge.tun{border-color:rgba(255,107,74,.45);color:var(--c-tun);background:rgba(255,107,74,.09)}
.badge.lauf{border-color:rgba(74,125,255,.45);color:#8fb0ff;background:rgba(74,125,255,.09)}
.badge.gut{border-color:rgba(74,211,160,.45);color:var(--c-gut);background:rgba(74,211,160,.09)}
.badge.frage{border-color:rgba(192,132,252,.45);color:var(--c-frage);background:rgba(192,132,252,.09)}
.badge.besicht{border-color:rgba(34,196,196,.45);color:var(--c-besicht);background:rgba(34,196,196,.09)}
.badge.neon{background:var(--neon);border-color:var(--neon);color:var(--neon-ink)}
.badge.aus{color:var(--txt-3);text-decoration:line-through}
.dim{color:var(--txt-3)}
.due{color:var(--c-tun);font-weight:650}
.blank{padding:46px 20px;text-align:center;color:var(--txt-3);font-size:13.5px;line-height:1.7}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;overflow:auto;backdrop-filter:blur(3px)}
.sheet{background:var(--card);border:1px solid var(--line-2);border-radius:16px;width:100%;max-width:760px;padding:26px}
.sheeth{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.sheeth h2{font-size:22px;font-weight:650;margin:0;letter-spacing:-.02em}
.shut{background:none;border:0;color:var(--txt-2);font-size:26px;line-height:1;cursor:pointer;padding:0 4px;width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fld label{display:block;font-size:10.5px;letter-spacing:.13em;color:var(--txt-3);font-weight:600;margin-bottom:6px}
.fld.wide{grid-column:1/-1}
.tip{font-size:11.5px;color:var(--txt-3);margin-top:6px;line-height:1.5}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.acts .sp{flex:1}
.kill{border:1px solid rgba(255,107,74,.4);background:none;color:var(--c-tun);font:inherit;font-size:13.5px;padding:12px 20px;border-radius:99px;cursor:pointer}
.note{font-size:12.5px;color:var(--txt-3);padding:16px 2px 0;line-height:1.6}
.alert{border:1px solid rgba(255,107,74,.4);background:rgba(255,107,74,.08);color:#ffb9a5;border-radius:12px;padding:13px 16px;font-size:13px;line-height:1.55;margin-bottom:16px}
.secTitle{font-size:11px;letter-spacing:.13em;color:var(--txt-3);font-weight:650;margin:20px 0 10px;text-transform:uppercase}
.locResult{border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin-top:6px;max-height:160px;overflow-y:auto}
.locResult div{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line)}
.locResult div:last-child{border-bottom:0}
.locResult div:hover{background:var(--card-2)}
.locPicked{display:flex;align-items:center;gap:10px;border:1px solid var(--neon);border-radius:9px;padding:9px 12px;font-size:13px}
.locPicked .sp{flex:1}
@media(max-width:820px){h1{font-size:32px} .shell{padding:18px 14px 70px} .board{overflow-x:auto} table{min-width:760px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="mark">◈</div>
    <div class="brand"><small>LEX NELSON</small><b>Motiv Cockpit</b></div>
    <div class="sp"></div>
    <div class="whoami" id="whoami"></div>
    <button class="cta quiet" id="btnGoogle" style="padding:9px 16px;font-size:13px">Mit Google verbinden</button>
  </div>
  <div class="head">
    <div><div class="eyebrow" id="eyebrow">MOTIVSUCHE</div><h1>Wen haben wir gefragt?</h1></div>
    <div class="sp"></div>

    <button class="pill" id="btnFilter" style="display:flex;align-items:center;gap:6px">🔎 Filter<span id="filterBadge" style="display:none;background:var(--neon);color:var(--neon-ink);border-radius:99px;width:16px;height:16px;font-size:10px;align-items:center;justify-content:center;font-weight:700">●</span></button>

  </div>
  <div id="body"></div>
  <div class="note" id="stand"></div>
</div>

<script>
const TOKEN = "patRjGhLKlkaJXOmU.bc33eb2db87b567a6aa1a7ff591aeafb226a498f930d31097ce32441ac6d4f5b";
const BASE = "appkllF2qSGRuxYt1";
const TBL_LOC = "tblNzlozaIyBXNO8p";
const TBL_ANF = "tblAf3hMsbyq9lc0V";
const TBL_PROJ = "Projekte";
const API = "https://api.airtable.com/v0/" + BASE + "/";

let PROJEKT_MOTIVE = {};
const STANDARD_PROJEKT_FALLBACK = "Heiland VI";
let STANDARD_PROJEKT = STANDARD_PROJEKT_FALLBACK;
const MOTIVE_FALLBACK = ["Show Außengelände","Aufenthaltsraum","Schnittraum","Präsentationsraum","Schule",
  "Plattenbauwohnung","Krankenhaus","Büro Staatsanwältin Kraus","Restaurant Pileckis",
  "Wohnung Linda","Wohnung Marion","Nagelstudio","Verpackungsbetrieb","Sonstiges"];
let MOTIVE = MOTIVE_FALLBACK;
const ALLG_MOTIVE = ["Wohnung","Haus","Büro","Schule","Krankenhaus","Restaurant","Ladengeschäft",
  "Außengelände","Industrie/Gewerbe","Plattenbau","Sonstiges"];
const ETAGEN = ["EG","Hochparterre","1. OG","2. OG","3. OG+"];
const BEZIRKE = ["Charlottenburg-Wilmersdorf","Friedrichshain-Kreuzberg","Lichtenberg","Marzahn-Hellersdorf","Mitte","Neukölln","Pankow","Reinickendorf","Spandau","Steglitz-Zehlendorf","Tempelhof-Schöneberg","Treptow-Köpenick"];
const STATUS = [
  {id:"Recherchiert",label:"Recherchiert",ton:"tun",hint:"gefunden, noch nicht angefragt"},
  {id:"Angefragt",label:"Angefragt",ton:"lauf",hint:"Anfrage raus, warten auf Antwort"},
  {id:"Rückfrage",label:"Rückfrage",ton:"frage",hint:"die wollen noch etwas von uns"},
  {id:"Besichtigung",label:"Besichtigung",ton:"besicht",hint:"Termin steht oder war"},
  {id:"Möglich",label:"Möglich",ton:"gut",hint:"Zusage da, Preis bekannt"},
  {id:"Gebucht",label:"Ausgesucht",ton:"neon",hint:"ausgesucht — bereit für den Aufnahmeleiter"},
  {id:"Absage",label:"Absage",ton:"aus",hint:"erledigt"}];
const KANAL = ["Mail","Telefon","BBFC","Vor Ort","Über Kontakt"];

let locations = [], anfragen = [], wer = "", view = "tun", q = "", fMotiv = "", offen = null, stand = "";
let fEtage = "", fQmMin = "", fQmMax = "", fBezirk = "", fProjekt = "";

const $ = s => document.querySelector(s);
function driveThumb(url, size){
  if(!url) return null;
  const m = String(url).match(/[-\w]{25,}/);
  if(!m) return null;
  return "https://drive.google.com/thumbnail?id="+m[0]+"&sz=w"+(size||160);
}
function alleSpezMotive(){
  const s = new Set(aktiveMotivliste());
  anfragen.forEach(a=>{ if(a.fields["Motiv (Drehbuch)"]) s.add(a.fields["Motiv (Drehbuch)"]); });
  return [...s].sort((a,b)=>a.localeCompare(b,'de'));
}
function alleAllgMotive(){
  const s = new Set(ALLG_MOTIVE);
  locations.forEach(l=>{ if(l.fields.Motiv) s.add(l.fields.Motiv); });
  return [...s].sort((a,b)=>a.localeCompare(b,'de'));
}
function alleProjekte(){
  const s = new Set(Object.keys(PROJEKT_MOTIVE));
  anfragen.forEach(a=>{ if(a.fields.Projekt) s.add(a.fields.Projekt); });
  return [...s].sort((a,b)=>a.localeCompare(b,'de'));
}
function driveOrdnerId(url){
  if(!url) return null;
  const m = String(url).match(/folders\/([-\w]{10,})/) || String(url).match(/[-\w]{25,}/);
  return m ? m[1] || m[0] : null;
}
const GOOGLE_CLIENT_ID = "852835258646-fshlr2lli09rbpr39t98b5tcc7r8lqbb.apps.googleusercontent.com";
let driveToken = null, driveTokenClient = null, galUid = 0;
const galFiles = {};

function initGoogle(){
  if(typeof google === "undefined" || !google.accounts){ setTimeout(initGoogle, 300); return; }
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/drive.readonly",
    callback: (resp) => {
      if(resp.error){ warn("Google-Anmeldung fehlgeschlagen: "+resp.error); return; }
      driveToken = resp.access_token;
      document.getElementById("btnGoogle").textContent = "Mit Google verbunden ✓";
      document.querySelectorAll("[data-galpending]").forEach(el => ladeGalerieFotos(el.id, el.dataset.folder));
    }
  });
}
document.getElementById("btnGoogle").onclick = () => {
  if(!driveTokenClient){ warn("Google-Anmeldung lädt noch, gleich nochmal versuchen."); return; }
  driveTokenClient.requestAccessToken();
};
initGoogle();

function driveGalerie(url){
  const id = driveOrdnerId(url);
  if(!id) return '<div class="tip">Kein Fotoordner hinterlegt.</div>';
  galUid++;
  const cid = "gal"+galUid;
  const fallback = '<div style="display:flex;justify-content:flex-end;margin-bottom:6px">'+
    '<a href="https://drive.google.com/drive/folders/'+id+'" target="_blank" rel="noopener" class="mini" style="text-decoration:none;display:inline-block">In Google Drive öffnen ↗</a></div>'+
    '<iframe src="https://drive.google.com/embeddedfolderview?id='+id+'#grid" style="width:100%;height:640px;border:1px solid var(--line-2);border-radius:9px;background:#fff"></iframe>'+
    '<div class="tip">Oben rechts „Mit Google verbinden" zeigt hier stattdessen große, durchklickbare Fotos direkt im Cockpit.</div>';
  if(driveToken){
    setTimeout(()=>ladeGalerieFotos(cid, id), 0);
    return '<div id="'+cid+'"><div class="tip">Fotos werden geladen…</div></div>';
  }
  return '<div id="'+cid+'" data-galpending data-folder="'+id+'">'+fallback+'</div>';
}

async function ladeGalerieFotos(containerId, folderId){
  const el = document.getElementById(containerId);
  if(!el || !driveToken) return;
  try{
    const q = encodeURIComponent("'"+folderId+"' in parents and trashed=false and mimeType contains 'image/'");
    const r = await fetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name,thumbnailLink)&pageSize=200",
      {headers:{Authorization:"Bearer "+driveToken}});
    if(r.status===401 || r.status===403){
      driveToken = null;
      const btn = document.getElementById("btnGoogle");
      if(btn) btn.textContent = "Mit Google verbinden";
      throw new Error("Verbindung abgelaufen — oben rechts neu verbinden.");
    }
    if(!r.ok) throw new Error(r.status+"");
    const data = await r.json();
    const files = (data.files||[]).filter(f=>f.thumbnailLink);
    if(!files.length){ el.innerHTML = '<div class="tip">Keine Fotos im Ordner gefunden.</div>'; return; }
    galFiles[containerId] = files;
    el.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px">'+
      files.map((f,i)=>'<img src="'+f.thumbnailLink.replace(/=s\d+/,"=s300")+'" data-gal="'+containerId+'" data-idx="'+i+'" '+
        'style="width:100%;height:110px;object-fit:cover;border-radius:7px;cursor:pointer;border:1px solid var(--line-2)">').join("")+
      '</div>';
  }catch(e){
    const grund = e.message.includes("abgelaufen") ? e.message : "Fotos laden fehlgeschlagen.";
    el.innerHTML = '<div class="tip">'+esc(grund)+' <a href="https://drive.google.com/drive/folders/'+folderId+'" target="_blank" rel="noopener" style="color:var(--neon)">Ordner in Drive öffnen ↗</a></div>';
  }
}

function lightbox(containerId, idx){
  const files = galFiles[containerId]; if(!files) return;
  idx = ((idx % files.length) + files.length) % files.length;
  const big = files[idx].thumbnailLink.replace(/=s\d+/,"=s1600");
  document.querySelectorAll(".lightbox").forEach(el=>el.remove());
  document.body.insertAdjacentHTML("beforeend",
    '<div class="lightbox" style="position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:60;display:flex;align-items:center;justify-content:center" data-cid="'+containerId+'" data-idx="'+idx+'">'+
    '<button style="position:absolute;top:20px;right:24px;background:none;border:0;color:#fff;font-size:32px;cursor:pointer;width:auto" data-lbx>×</button>'+
    (files.length>1?'<button style="position:absolute;left:16px;background:none;border:0;color:#fff;font-size:40px;cursor:pointer;width:auto" data-lbprev>‹</button>':'')+
    '<img src="'+big+'" style="max-width:88vw;max-height:88vh;object-fit:contain;border-radius:8px">'+
    (files.length>1?'<button style="position:absolute;right:16px;background:none;border:0;color:#fff;font-size:40px;cursor:pointer;width:auto" data-lbnext>›</button>':'')+
    '</div>');
}
document.addEventListener("click", ev=>{
  const img = ev.target.closest("[data-gal]");
  if(img){ lightbox(img.dataset.gal, Number(img.dataset.idx)); return; }
  const lb = ev.target.closest(".lightbox");
  if(lb){
    if(ev.target.closest("[data-lbx]") || ev.target===lb) return lb.remove();
    if(ev.target.closest("[data-lbprev]")) return lightbox(lb.dataset.cid, Number(lb.dataset.idx)-1);
    if(ev.target.closest("[data-lbnext]")) return lightbox(lb.dataset.cid, Number(lb.dataset.idx)+1);
  }
});
const heute = () => new Date().toISOString().slice(0,10);
const st = id => STATUS.find(s=>s.id===id) || STATUS[0];
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt = d => d ? d.slice(8,10)+"."+d.slice(5,7)+"."+d.slice(2,4) : "";
const locOf = a => locations.find(l => (a.fields.Location||[])[0] === l.id);
function warn(t){ $("#alert").innerHTML = t ? '<div class="alert">'+esc(t)+'</div>' : ""; }
function warnIn(id, t){
  const el = document.getElementById(id);
  if(el) el.innerHTML = t ? '<div class="alert">'+esc(t)+'</div>' : "";
  warn(t);
}

async function api(path, opts){
  const r = await fetch(API+path, Object.assign({headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"}}, opts||{}));
  if(!r.ok){ const t = await r.text(); throw new Error(r.status+": "+t.slice(0,160)); }
  return r.json();
}
async function alle(tableId){
  let out = [], offset;
  do{
    const j = await api(tableId + (offset ? "?pageSize=100&offset="+offset : "?pageSize=100"));
    out = out.concat(j.records); offset = j.offset;
  }while(offset);
  return out;
}

async function laden(still){
  try{
    const [l,a,p] = await Promise.all([alle(TBL_LOC), alle(TBL_ANF), alle(TBL_PROJ)]);
    locations = l; anfragen = a;
    const neuePM = {};
    p.forEach(rec=>{
      const name = rec.fields.Name;
      const liste = (rec.fields.Pflichtmotive||"").split("\n").map(s=>s.trim()).filter(Boolean);
      if(name && liste.length) neuePM[name] = liste;
    });
    if(Object.keys(neuePM).length){
      PROJEKT_MOTIVE = neuePM;
      MOTIVE = PROJEKT_MOTIVE[STANDARD_PROJEKT_FALLBACK] || PROJEKT_MOTIVE[Object.keys(PROJEKT_MOTIVE)[0]] || MOTIVE_FALLBACK;
      STANDARD_PROJEKT = PROJEKT_MOTIVE[STANDARD_PROJEKT_FALLBACK] ? STANDARD_PROJEKT_FALLBACK : Object.keys(PROJEKT_MOTIVE)[0];
    }
    if(!still) warn("");
    stand = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  }catch(e){ warn("Airtable antwortet gerade nicht (" + e.message + "). Zuletzt geladener Stand bleibt sichtbar."); }
  zeichnen();
}

const offeneListe = list => list.filter(a=>{
  if(["Gebucht","Absage"].includes(a.fields.Status)) return false;
  if(a.fields.Status==="Recherchiert") return true;
  return a.fields.Wiedervorlage && a.fields.Wiedervorlage <= heute();
}).sort((x,y)=>((x.fields.Wiedervorlage||"9")<(y.fields.Wiedervorlage||"9")?-1:1));

function sichtbar(){
  return anfragen.filter(a=>{
    const l = locOf(a) || {fields:{}};
    if(fMotiv && (a.fields["Motiv (Drehbuch)"]||"") !== fMotiv) return false;
    if(fProjekt && (a.fields.Projekt||"") !== fProjekt) return false;
    if(fEtage && l.fields.Etage !== fEtage) return false;
    if(fBezirk && l.fields.Bezirk !== fBezirk) return false;
    if(fQmMin && !(Number(l.fields.qm)>=Number(fQmMin))) return false;
    if(fQmMax && !(Number(l.fields.qm)<=Number(fQmMax))) return false;
    if(!q) return true;
    const felder = [a.fields.Titel,l.fields.Name,l.fields.Adresse,a.fields.Ansprechpartner,a.fields.Notiz,a.fields.Preis,l.fields.Motiv,a.fields["Motiv (Drehbuch)"],st(a.fields.Status).label,a.fields["Rückmeldung Motivgeber"],a.fields["Entscheidung Regie"]]
      .map(v=>(v||"").toLowerCase());
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(wort => felder.some(f=>f.includes(wort)));
  });
}

function aktiveMotivliste(){
  return PROJEKT_MOTIVE[fProjekt] || PROJEKT_MOTIVE[STANDARD_PROJEKT] || MOTIVE_FALLBACK;
}

  $("#kpis").innerHTML = [

    ['b','ZU TUN', offeneListe(anfragenProjekt).length+'<span class="unit">Anfragen</span>', 'Nicht angefragt oder Wiedervorlage überfällig, nur '+projektLabel+'.'],
    ['c','IM GESPRÄCH', laufend.length+'<span class="unit">Anfragen</span>', 'Angefragt, in Rückfrage oder Besichtigung, nur '+projektLabel+'.'],
    ['d','AUSGESUCHT', gebucht.length+'<span class="unit">Anfragen</span>', gebucht.length?gebucht.slice(0,2).map(a=>(locOf(a)||{}).fields?.Name||a.fields.Titel).join(" · "):'Noch nichts ausgesucht.'],
    ['','LOCATIONS GESAMT', locations.length+'<span class="unit">im Archiv</span>', stand?'Live aus Airtable, zuletzt geladen '+stand+'.':'Live aus Airtable.']
  ].map(([k,h,n,f])=>'<div class="kpi '+k+'"><h3>'+h+'</h3><div class="num">'+n+'</div><div class="foot">'+esc(f)+'</div></div>').join("");

  $("#fMotiv").innerHTML = '<option value="">Alle Motive</option>'+(view==="archiv"?alleAllgMotive():alleSpezMotive()).map(m=>'<option'+(fMotiv===m?' selected':'')+'>'+esc(m)+'</option>').join("");
  const projekte = alleProjekte();
  $("#fProjekt").style.display = view==="archiv" ? "none" : "inline-block";
  $("#fProjekt").innerHTML = '<option value="">Alle Projekte</option>'+projekte.map(p=>'<option'+(fProjekt===p?' selected':'')+'>'+esc(p)+'</option>').join("");
  $("#suche").value = q;
  const filterAktiv = fEtage||fQmMin||fQmMax||fBezirk;
  $("#filterBadge").style.display = filterAktiv ? "flex" : "none";
  document.querySelectorAll(".pill[data-view]").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===view));
  $("#btnCsv").textContent = view==="archiv" ? "Archiv als CSV laden" : "Anfragen als CSV laden";
  $("#exportZahl").textContent = anfragen.filter(a=>a.fields.Status==="Gebucht" && !a.fields["An Aufnahmeleiter gesendet"]).length;

  const b = $("#body");
  if(view==="tun") b.innerHTML = tun.length ? tafel(tun,true) : '<div class="board"><div class="blank">Nichts fällig.<br>Entweder ist alles nachgefasst — oder es fehlen noch Anfragen.</div></div>';
  else if(view==="alle") b.innerHTML = sicht.length ? tafel(sicht,true) : '<div class="board"><div class="blank">Noch keine Anfragen. Leg oben die erste an.</div></div>';
  else if(view==="archiv"){
    const ls = sichtbarLocations();
    b.innerHTML = ls.length ? tafelLocations(ls) : '<div class="board"><div class="blank">Noch keine Locations im Archiv. Leg oben eine an.</div></div>';
  }
  else b.innerHTML = alleSpezMotive().map(m=>{
    const e = sicht.filter(a=>(a.fields["Motiv (Drehbuch)"]||"")===m);

      (e.length ? tafel(e,false) : '<div class="board"><div class="blank">Hier fehlt noch alles.</div></div>')+'</div>';

  $("#stand").textContent = "Läuft direkt gegen eure Airtable-Datenbank, keine Zwischenkopie." + (stand ? " Zuletzt geladen um "+stand+" Uhr." : "");
}

function sichtbarLocations(){
  return locations.filter(l=>{
    if(fMotiv && l.fields.Motiv !== fMotiv) return false;
    if(fEtage && l.fields.Etage !== fEtage) return false;
    if(fBezirk && l.fields.Bezirk !== fBezirk) return false;
    if(fQmMin && !(Number(l.fields.qm)>=Number(fQmMin))) return false;
    if(fQmMax && !(Number(l.fields.qm)<=Number(fQmMax))) return false;
    if(!q) return true;
    const felder = [l.fields.Name,l.fields.Adresse,l.fields.Ansprechpartner,l.fields.Telefon,l.fields.Mail,l.fields.Notiz,l.fields.Motiv,l.fields.Website]
      .map(v=>(v||"").toLowerCase());
    return q.toLowerCase().split(/\s+/).filter(Boolean).every(wort => felder.some(f=>f.includes(wort)));
  }).sort((a,b)=>(b.fields["Erstellt am"]||"").localeCompare(a.fields["Erstellt am"]||""));
}

  $("#locSuche").addEventListener("input", e=>{
    const val = e.target.value.trim();
    offen._locId=null; offen._locNeu=null;
    if(!val){ $("#locResult").innerHTML=""; return; }
    const treffer = locations.filter(l=>(l.fields.Name||"").toLowerCase().includes(val.toLowerCase())).slice(0,6);
    $("#locResult").innerHTML = treffer.map(l=>'<div data-pick="'+l.id+'">'+esc(l.fields.Name)+(l.fields.Motiv?' · '+esc(l.fields.Motiv):'')+'</div>').join("")
      + '<div data-neu="'+esc(val)+'" style="color:var(--neon)">+ „'+esc(val)+'" als neue Location anlegen</div>';
  });
  veil.addEventListener("click", ev=>{
    const pick = ev.target.closest("[data-pick]");
    if(pick){
      offen._locId=pick.dataset.pick; offen._locNeu=null; $("#locResult").innerHTML=""; $("#locSuche").value=""; $("#locSucheWrap").hidden=true;
      const gew = locations.find(x=>x.id===offen._locId);
      if(gew){
        [["Ansprechpartner","Ansprechpartner"],["Telefon","Telefon"],["Mail","Mail"]].forEach(([af,lf])=>{
          if(!offen.fields[af] && gew.fields[lf]){
            offen.fields[af] = gew.fields[lf];
            const el = veil.querySelector('[data-k="'+af+'"]'); if(el) el.value = gew.fields[lf];
          }
        });
      }
      locBlockZeichnen(); return;
    }
    const neu = ev.target.closest("[data-neu]");
    if(neu){ offen._locNeu={Name:neu.dataset.neu, Motiv:""}; offen._locId=null; $("#locResult").innerHTML=""; $("#locSuche").value=""; $("#locSucheWrap").hidden=true; locBlockZeichnen(); return; }
    if(ev.target.closest("[data-locClear]")){ offen._locId=null; offen._locNeu=null; $("#locSucheWrap").hidden=false; $("#locSuche").value=""; $("#locSuche").focus(); locBlockZeichnen(); return; }
  });
  veil.addEventListener("input", ev=>{
    const k = ev.target.dataset.k;
    if(k){
      offen.fields[k] = ev.target.value;
      if(k==="Status"){
        $("#tipStatus").textContent = st(offen.fields.Status).hint;
        const block = $("#anfrageBlock");
        if(offen.fields.Status==="Recherchiert"){ block.hidden=true; offen.fields["Angefragt am"]=""; offen.fields.Wiedervorlage=""; }
        else block.hidden=false;
        if(offen.fields.Status==="Angefragt" && !offen.fields["Angefragt am"]) offen.fields["Angefragt am"]=heute();
        veil.querySelector('[data-k="Angefragt am"]').value = offen.fields["Angefragt am"]||"";
        veil.querySelector('[data-k="Wiedervorlage"]').value = offen.fields.Wiedervorlage||"";
      }
      return;
    }
    if(offen._locNeu){
      ["nMotiv:Motiv","nEtage:Etage","nQm:qm","nZimmer:Zimmer","nAdresse:Adresse","nWeb:Website","nFotos:Fotos (Drive-Link)"].forEach(pair=>{
        const [id,key]=pair.split(":"); const el=document.getElementById(id);
        if(el) offen._locNeu[key]=el.value;
      });
    }
  });
  veil.addEventListener("click", async ev=>{
    if(ev.target.closest("[data-x]")) return zu();
    if(ev.target.closest("[data-kill]")){ if(await loeschen(a)) zu(); }
    if(ev.target.closest("[data-save]")){
      if(!offen._locId && !offen._locNeu){ $("#locSuche").focus(); warnIn("veilAlert","Bitte erst eine Location wählen oder neu anlegen."); return; }
      if(await sichern()) zu();
    }
  });
}
function zu(){ const v=$("#veil"); if(v) v.remove(); offen=null; }

function historieHtml(locId){
  const treffer = anfragen.filter(a=>(a.fields.Location||[])[0]===locId)
    .sort((a,b)=>(b.fields["Angefragt am"]||b.fields["Erstellt am"]||"").localeCompare(a.fields["Angefragt am"]||a.fields["Erstellt am"]||""));
  if(!treffer.length) return '<div class="secTitle">Verwendungshistorie</div><div class="tip" style="margin-bottom:6px">Noch bei keinem Projekt angefragt.</div>';
  return '<div class="secTitle">Verwendungshistorie</div>'+
    '<div style="border:1px solid var(--line-2);border-radius:9px;overflow:hidden;margin-bottom:6px">'+
    treffer.map((a,i)=>{
      const s = st(a.fields.Status);
      const datum = a.fields["Angefragt am"] ? dt(a.fields["Angefragt am"]) : (a.fields["Erstellt am"]?dt(a.fields["Erstellt am"]):"—");
      return '<div style="padding:10px 12px;'+(i<treffer.length-1?'border-bottom:1px solid var(--line);':'')+'display:flex;gap:10px;align-items:center;font-size:13px">'+
        '<span class="badge '+s.ton+'" style="flex:none">'+s.label+'</span>'+
        '<span style="flex:1"><b>'+esc(a.fields.Projekt||"ohne Projekt")+'</b> · '+esc(a.fields.Ansprechpartner||"")+'</span>'+
        '<span class="dim">'+datum+'</span></div>';
    }).join("")+
    '</div>';
}
function maskeLocation(l){
  const neu = !l.id;
  const flds = l.fields || {};
  const f=(k,lab,extra)=>'<div class="fld'+(extra||"")+'"><label>'+lab+'</label>';
  document.body.insertAdjacentHTML("beforeend",
   '<div class="veil" id="veilLoc"><div class="sheet">'+
    '<div class="sheeth"><h2>'+esc(neu?"Neue Location":(flds.Name||"Location"))+'</h2><button class="shut" data-lx>×</button></div>'+
    '<div id="veilAlertLoc"></div>'+
    '<div class="grid">'+
      f("name","NAME"," wide")+'<input data-lk="Name" value="'+esc(flds.Name||"")+'" placeholder="Ballhaus Berlin"></div>'+
      f("motiv","MOTIV")+'<input data-lk="Motiv" list="motivListe" value="'+esc(flds.Motiv||"")+'" placeholder="Frei eintippen oder aus Vorschlägen wählen"></div>'+
      '<datalist id="motivListe">'+alleAllgMotive().map(m=>'<option value="'+esc(m)+'">').join("")+'</datalist>'+
      f("etage","ETAGE")+'<select data-lk="Etage"><option value="">—</option>'+ETAGEN.map(e=>'<option'+(flds.Etage===e?" selected":"")+'>'+e+'</option>').join("")+'</select></div>'+
      f("qm","QM")+'<input data-lk="qm" type="number" value="'+esc(flds.qm||"")+'"></div>'+
      f("zimmer","ZIMMER")+'<input data-lk="Zimmer" type="number" value="'+esc(flds.Zimmer||"")+'"></div>'+
      f("bezirk","BEZIRK")+'<select data-lk="Bezirk"><option value="">—</option>'+BEZIRKE.map(b=>'<option'+(flds.Bezirk===b?" selected":"")+'>'+b+'</option>').join("")+'</select></div>'+
      f("adresse","ADRESSE"," wide")+'<textarea data-lk="Adresse" rows="2">'+esc(flds.Adresse||"")+'</textarea></div>'+
      f("web","WEBSITE"," wide")+'<input data-lk="Website" value="'+esc(flds.Website||"")+'"></div>'+
      f("kontakt","ANSPRECHPARTNER")+'<input data-lk="Ansprechpartner" value="'+esc(flds.Ansprechpartner||"")+'"></div>'+
      f("telefon","TELEFON")+'<input data-lk="Telefon" value="'+esc(flds.Telefon||"")+'"></div>'+
      f("mail","MAIL")+'<input data-lk="Mail" value="'+esc(flds.Mail||"")+'"></div>'+
      (flds["Erstellt am"] ? f("erstellt","ERSTELLT AM")+'<input value="'+esc(dt(flds["Erstellt am"]))+'" disabled></div>' : "")+
      f("fotos","FOTOS (DRIVE-ORDNER-LINK)"," wide")+'<input data-lk="Fotos (Drive-Link)" value="'+esc(flds["Fotos (Drive-Link)"]||"")+'"></div>'+
      '<div class="fld wide" id="galerieLoc">'+driveGalerie(flds["Fotos (Drive-Link)"])+'</div>'+
      f("notiz","NOTIZ"," wide")+'<textarea data-lk="Notiz" rows="3">'+esc(flds.Notiz||"")+'</textarea></div>'+
      f("titelfoto","TITELFOTO"," wide")+'<input data-lk="Titelfoto (Drive-Link)" value="'+esc(flds["Titelfoto (Drive-Link)"]||"")+'" placeholder="Link von einem einzelnen Foto"></div>'+
      '<div class="fld wide" id="titelfotoVorschau">'+(driveThumb(flds["Titelfoto (Drive-Link)"],120)?'<img src="'+driveThumb(flds["Titelfoto (Drive-Link)"],120)+'" onerror="this.outerHTML=\'<div class=&quot;tip&quot;>Lädt nicht — dieses Foto in Drive öffnen, Rechtsklick, Freigeben, extra auf &quot;Jeder mit dem Link&quot; stellen. Nicht nur der Ordner, dieses eine Foto.</div>\'" style="height:80px;border-radius:8px;border:1px solid var(--line-2)">':'<div class="tip">Wichtig: Nicht den Ordner-Link, sondern von einem einzelnen Foto. Und: dieses Foto muss zusätzlich extra auf „Jeder mit dem Link" freigegeben sein — der offene Ordner allein reicht nicht.</div>')+'</div>'+
    '</div>'+
    (neu ? "" : historieHtml(l.id)) +
    '<div class="acts">'+(neu?"":'<button class="kill" data-lkill>Löschen</button>')+'<div class="sp"></div><button class="cta quiet" data-lx>Abbrechen</button><button class="cta" data-lsave>'+(neu?"In der Datenbank anlegen":"Sichern")+'</button></div>'+
   '</div></div>');
  const patch = {};
  const veil = $("#veilLoc");
  veil.addEventListener("input", ev=>{
    const k=ev.target.dataset.lk;
    if(k) patch[k]=ev.target.value;
    if(k==="Fotos (Drive-Link)") $("#galerieLoc").innerHTML = driveGalerie(ev.target.value);
    if(k==="Titelfoto (Drive-Link)"){
      const t = driveThumb(ev.target.value,120);
      $("#titelfotoVorschau").innerHTML = t
        ? '<img src="'+t+'" onerror="this.outerHTML=\'<div class=&quot;tip&quot;>Lädt nicht — dieses Foto extra auf &quot;Jeder mit dem Link&quot; freigeben, nicht nur den Ordner.</div>\'" style="height:80px;border-radius:8px;border:1px solid var(--line-2)">'
        : '<div class="tip">Wichtig: Dieses Foto muss zusätzlich extra freigegeben sein.</div>';
    }
  });
  veil.addEventListener("click", async ev=>{
    if(ev.target.closest("[data-lx]")) return veil.remove();
    if(ev.target.closest("[data-lkill]")){
      const haengt = anfragen.filter(a=>(a.fields.Location||[])[0]===l.id);
      if(haengt.length && !confirm(haengt.length+" Anfrage(n) hängen an dieser Location und werden mitgelöscht. Wirklich löschen?")) return;
      try{
        if(haengt.length) await fetch(API+TBL_ANF+"?"+haengt.map(a=>"records[]="+a.id).join("&"), {method:"DELETE", headers:{Authorization:"Bearer "+TOKEN}});
        const r = await fetch(API+TBL_LOC+"?records[]="+l.id, {method:"DELETE", headers:{Authorization:"Bearer "+TOKEN}});
        if(!r.ok) throw new Error(await r.text());
        await laden(); warn(""); veil.remove();
      }catch(e){ warnIn("veilAlertLoc","Löschen fehlgeschlagen: "+e.message); }
      return;
    }
    if(ev.target.closest("[data-lsave]")){
      const nameEl = veil.querySelector('[data-lk="Name"]');
      if(!("Name" in patch) && !flds.Name){ nameEl.focus(); warnIn("veilAlertLoc","Name ist Pflicht."); return; }
      const fields = Object.assign({}, flds, patch);
      if(!fields.Name){ nameEl.focus(); warnIn("veilAlertLoc","Name ist Pflicht."); return; }
      if(fields.qm) fields.qm = Number(fields.qm);
      if(fields.Zimmer) fields.Zimmer = Number(fields.Zimmer);
      if(neu){ fields["Angelegt von"] = wer; fields["Erstellt am"] = heute(); }
      try{
        if(neu) await api(TBL_LOC, {method:"POST", body: JSON.stringify({records:[{fields}], typecast:true})});
        else await api(TBL_LOC, {method:"PATCH", body: JSON.stringify({records:[{id:l.id, fields}], typecast:true})});
        await laden(); warn(""); veil.remove();
      }catch(e){ warnIn("veilAlertLoc","Speichern fehlgeschlagen: "+e.message); }
    }
  });
}

const ANFRAGEN_LOOKUP_FELDER = ["Adresse (Location)","Fotos (Location)","Titelfoto (Location)","Fotos (Links, Location)"];
function ohneLookups(fields){
  const out = Object.assign({}, fields);
  ANFRAGEN_LOOKUP_FELDER.forEach(k => delete out[k]);
  return out;
}

async function sichern(){
  try{
    let locId = offen._locId;
    if(offen._locNeu){
      const flds = Object.assign({}, offen._locNeu, {"Angelegt von": wer, "Erstellt am": heute()});
      if(flds.qm) flds.qm = Number(flds.qm);
      if(flds.Zimmer) flds.Zimmer = Number(flds.Zimmer);
      const created = await api(TBL_LOC, {method:"POST", body: JSON.stringify({records:[{fields:flds}], typecast:true})});
      locId = created.records[0].id;
    }
    const fields = ohneLookups(Object.assign({}, offen.fields, {Location:[locId], Von: offen.fields.Von||wer}));
    if(offen.id) await api(TBL_ANF, {method:"PATCH", body: JSON.stringify({records:[{id:offen.id, fields}], typecast:true})});
    else await api(TBL_ANF, {method:"POST", body: JSON.stringify({records:[{fields}], typecast:true})});
    if(!offen._locNeu){
      const zielLoc = locations.find(x=>x.id===locId);
      if(zielLoc){
        const nachtrag = {};
        [["Ansprechpartner","Ansprechpartner"],["Telefon","Telefon"],["Mail","Mail"]].forEach(([af,lf])=>{
          const wertNeu = fields[af];
          const wertUrspruenglich = (offen._origFields||{})[af];
          const wurdeGeaendert = wertNeu && wertNeu !== wertUrspruenglich;
          if(wurdeGeaendert && zielLoc.fields[lf] !== wertNeu) nachtrag[lf] = wertNeu;
        });
        if(Object.keys(nachtrag).length) await api(TBL_LOC, {method:"PATCH", body: JSON.stringify({records:[{id:locId, fields:nachtrag}], typecast:true})});
      }
    }
    await laden(); warn(""); return true;
  }catch(e){ warnIn("veilAlert","Speichern fehlgeschlagen: "+e.message); return false; }
}
async function loeschen(a){
  try{
    const r = await fetch(API+TBL_ANF+"?records[]="+a.id, {method:"DELETE", headers:{Authorization:"Bearer "+TOKEN}});
    if(!r.ok) throw new Error(await r.text());
    await laden(); return true;
  }catch(e){ warnIn("veilAlert","Löschen fehlgeschlagen: "+e.message); return false; }
}

function exportAufnahmeleiter(){
  const kandidaten = anfragen.filter(a=>a.fields.Status==="Gebucht" && !a.fields["An Aufnahmeleiter gesendet"]);
  if(!kandidaten.length){ warn('Nichts zu exportieren — alle „Ausgesucht"-Anfragen wurden bereits als gesendet markiert.'); return; }
  const sp=["Motiv (Drehbuch)","Name","Adresse","Bezirk","Etage","qm","Zimmer","Ansprechpartner","Telefon","Mail","Website","Fotos (Drive-Link)","Preis","Projekt","Notiz"];
  const c=v=>'"'+String(v??"").replace(/"/g,'""').replace(/\n/g," ")+'"';
  const rows = kandidaten.map(a=>{
    const l = locOf(a)||{fields:{}};
    return [a.fields["Motiv (Drehbuch)"],l.fields.Name,l.fields.Adresse,l.fields.Bezirk,l.fields.Etage,l.fields.qm,l.fields.Zimmer,
      a.fields.Ansprechpartner||l.fields.Ansprechpartner,a.fields.Telefon||l.fields.Telefon,a.fields.Mail||l.fields.Mail,
      l.fields.Website,l.fields["Fotos (Drive-Link)"],a.fields.Preis,a.fields.Projekt,a.fields.Notiz].map(c).join(";");
  });
  const blob = new Blob(["\uFEFF"+[sp.map(c).join(";"),...rows].join("\n")],{type:"text/csv;charset=utf-8"});
  const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download="expose-aufnahmeleiter_"+heute()+".csv"; link.click();
  warn("");
}
function csv(){
  const sp=["Motiv (Drehbuch)","Location","Motiv (allgemein)","Adresse","Website","qm","Etage","Projekt","Status","Ansprechpartner","Telefon","Mail","Angefragt am","Kanal","Wiedervorlage","Besichtigungstermin","Besichtigungszeit","Preis","Notiz","Von"];
  const c=v=>'"'+String(v??"").replace(/"/g,'""').replace(/\n/g," ")+'"';
  const rows = anfragen.map(a=>{const l=locOf(a)||{fields:{}};return [a.fields["Motiv (Drehbuch)"],l.fields.Name,l.fields.Motiv,l.fields.Adresse,l.fields.Website,l.fields.qm,l.fields.Etage,a.fields.Projekt,a.fields.Status,a.fields.Ansprechpartner,a.fields.Telefon,a.fields.Mail,a.fields["Angefragt am"],a.fields.Kanal,a.fields.Wiedervorlage,a.fields.Besichtigungstermin,a.fields.Besichtigungszeit,a.fields.Preis,a.fields.Notiz,a.fields.Von].map(c).join(";");});
  const blob = new Blob(["\uFEFF"+[sp.map(c).join(";"),...rows].join("\n")],{type:"text/csv;charset=utf-8"});
  const link=document.createElement("a"); link.href=URL.createObjectURL(blob); link.download="anfragen_"+heute()+".csv"; link.click();
}
function csvArchiv(){

  const blob = new Blob(["\uFEFF"+[sp.map(c).join(";"),...rows].join("\n")],{type:"text/csv;charset=utf-8"});

function filterMaske(){
  document.body.insertAdjacentHTML("beforeend",
   '<div class="veil" id="veilFilter"><div class="sheet" style="max-width:480px">'+
    '<div class="sheeth"><h2>Filter</h2><button class="shut" data-fx>×</button></div>'+
    '<div class="grid">'+
      '<div class="fld"><label>ETAGE</label><select id="filEtage"><option value="">Alle</option>'+ETAGEN.map(e=>'<option'+(fEtage===e?" selected":"")+'>'+e+'</option>').join("")+'</select></div>'+
      '<div class="fld"><label>QM VON</label><input id="filQmMin" type="number" value="'+esc(fQmMin)+'" placeholder="z.B. 60"></div>'+
      '<div class="fld"><label>QM BIS</label><input id="filQmMax" type="number" value="'+esc(fQmMax)+'" placeholder="z.B. 100"></div>'+
      '<div class="fld"><label>BEZIRK</label><select id="filBezirk"><option value="">Alle</option>'+BEZIRKE.map(b=>'<option'+(fBezirk===b?" selected":"")+'>'+b+'</option>').join("")+'</select></div>'+
    '</div>'+
    '<div class="acts"><button class="cta quiet" id="filReset">Zurücksetzen</button><div class="sp"></div><button class="cta quiet" data-fx>Abbrechen</button><button class="cta" id="filApply">Anwenden</button></div>'+
   '</div></div>');
  const v = $("#veilFilter");
  v.addEventListener("click", ev=>{
    if(ev.target===v || ev.target.closest("[data-fx]")) return v.remove();
    if(ev.target.closest("#filReset")){
      fEtage=""; fQmMin=""; fQmMax=""; fBezirk="";
      v.remove(); zeichnen(); return;
    }
    if(ev.target.closest("#filApply")){
      fEtage = $("#filEtage").value;
      fQmMin = $("#filQmMin").value;
      fQmMax = $("#filQmMax").value;
      fBezirk = $("#filBezirk").value;
      v.remove(); zeichnen();
    }
  });
}

document.addEventListener("click", ev=>{
  const w = ev.target.closest("[data-wer]"); if(w){ wer=w.dataset.wer; return zeichnen(); }
  const p = ev.target.closest(".pill[data-view]"); if(p){ const warArchiv=view==="archiv"; view=p.dataset.view; if(warArchiv!==(view==="archiv")) fMotiv=""; return zeichnen(); }
  const tr = ev.target.closest("tr[data-id]"); if(tr){ const it=anfragen.find(a=>a.id===tr.dataset.id); if(it) maske(it); }
  const trl = ev.target.closest("tr[data-locid]"); if(trl){ const it=locations.find(l=>l.id===trl.dataset.locid); if(it) maskeLocation(it); }
});
$("#btnNeu").onclick = () => wer && maske(leerAnfrage());
$("#btnFilter").onclick = filterMaske;
$("#btnExportMarkiert").onclick = exportAufnahmeleiter;
$("#btnNeuLoc").onclick = () => wer && maskeLocation({fields:{}});
$("#btnSync").onclick = () => laden();
$("#btnCsv").onclick = () => view==="archiv" ? csvArchiv() : csv();
$("#suche").oninput = e => { q=e.target.value; zeichnen(); };
$("#fMotiv").onchange = e => { fMotiv=e.target.value; zeichnen(); };
$("#fProjekt").onchange = e => { fProjekt=e.target.value; zeichnen(); };

zeichnen();
laden();
setInterval(()=>{ if(!offen) laden(true); }, 20000);
